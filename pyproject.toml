[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gmlx"
version = "0.5.1"
description = "A local inference platform for Apple Silicon: run, chat with, serve, and fine-tune the GGUF ecosystem's quantized models natively on MLX, straight off the file."
readme = "README.md"
requires-python = ">=3.11"  # 3.10 EOLs 2026-10; mlx-kquant's lower floor is a library floor
# MIT covers the files with an SPDX MIT header (LICENSE-MIT). Apache-2.0
# covers the ComfyUI node pack in gmlx/comfyui_pack (its own LICENSE). MIT
# and Apache-2.0 also cover the third-party files that licenses/ lists.
license = "BUSL-1.1 AND MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "gmlx/comfyui_pack/LICENSE", "licenses/*",
                 "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Asher Feldman" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# mlx-kquant supplies the K-quant ops/kernels + the C++ GGUF wire-byte reader,
# and pins the exact mlx its kernels were built against. gmlx carries
# mlx-vlm 0.7.3 and mlx-lm 0.31.3 in gmlx/_vendor and declares what that
# copy imports instead of either package. check_mlx_version
# (gmlx.upstream.versions) enforces the mlx floor the copy needs at runtime:
# a stale venv resolves these constraints only once, so the pip pin alone
# can't catch it. See docs/internals/upstream-upgrades.md.
dependencies = [
    # 0.5.0 on pins mlx 0.32.3, above the copied mlx-vlm's floor of 0.32.2
    # (tests/test_ci_pins.py checks the CI pin); <0.6 guards the next
    # kquant breaking change.
    "mlx-kquant>=0.5.6,<0.6",
    # Direct imports of both throughout (mx.*, np.*).
    "mlx",
    "numpy",
    # The interactive prompts: the gmlx chat line editor, the init wizard
    # and the gmlx pull picker, built and tested on this release.
    "prompt_toolkit>=3.0.52",
    # The copy's floors. tests/test_dependencies.py holds each requirement
    # of the copied releases to a decision here.
    "jinja2>=3.1.0",
    # Also image reads and writes for `gmlx image`, which needs
    # Image.Resampling (9.1 on).
    "Pillow>=10.3.0",
    # response_format json_schema: grammar-constrained decoding.
    "llguidance>=1.7.0",
    "requests>=2.31.0",
    "starlette>=1.0.1",
    "sentencepiece>=0.2.0",
    "protobuf",
    # The copy's speech-to-text routes parse multipart forms.
    "python-multipart>=0.0.9",
    # The copy's server imports mlx_audio at module top on every serve. It
    # also brings miniaudio and tqdm, which the copy imports.
    "mlx-audio>=0.5.2",
    # The release the copied mlx-vlm was qualified with; it also excludes
    # 5.13.0. The old <5.13 ceiling (AutoTokenizer.register() vs mlx-lm's
    # NewlineTokenizer) no longer reproduces on 5.15.1.
    "transformers>=5.14.0",
    "tokenizers",
    "gguf",
    # comment-preserving YAML round-trip for `gmlx sync-models`.
    "ruamel.yaml",
    # config.py loads model/profile YAML with PyYAML at module top.
    "pyyaml",
    # gmlx route surgery (server_patches._common) walks both route
    # layouts: inline (< 0.137) and _IncludedRouter wrappers (0.137+,
    # verified through 0.140.13). The ceiling guards the next layout
    # change.
    "fastapi>=0.95.1,<0.141",
    "uvicorn",
    # `gmlx menubar`: a macOS status-bar monitor for a backgrounded server.
    "rumps>=0.4,<0.5; sys_platform == 'darwin'",
    # Menu bar tap-to-talk hotkey: CGEventTap (Quartz) for the active
    # <modifier>+Space tap, AXIsProcessTrusted (ApplicationServices) for
    # the Accessibility permission it needs.
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    # `gmlx launch --container` with `clipboard: images` reads clipboard
    # images through AppKit's NSPasteboard.
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Vision support is part of the core install. This empty extra is kept for
# back-compat so an existing `pip install 'gmlx[vlm]'` still resolves.
vlm = []
# Video input, and DeepSeek-VL image input: the copied mlx-vlm reads video
# frames and resizes those images with OpenCV, and names this extra when
# OpenCV is missing.
video = ["opencv-python>=4.12.0.88"]
# `gmlx chat` styled markdown: tables and syntax-colored code blocks.
chat = ["rich"]
# Speech-to-text: POST /v1/audio/transcriptions on the server, backed by
# mlx-whisper (MLX-format Whisper checkpoints - not GGUFs; whisper.cpp uses its
# own ggml container). python-multipart parses the OpenAI multipart upload.
# Audio decoding additionally needs ffmpeg in /opt/homebrew/bin or /usr/local/bin.
stt = ["mlx-whisper", "python-multipart"]
# Text-to-speech: POST /v1/audio/speech on the server, backed by mlx-audio
# (MLX-format TTS checkpoints - Kokoro, Qwen3-TTS, ... - not GGUFs). WAV encodes
# via miniaudio; mp3/flac/opus additionally need ffmpeg in /opt/homebrew/bin
# or /usr/local/bin.
# Kokoro's grapheme->phoneme front-end is the vendored misaki snapshot
# (gmlx/_vendor - PyPI misaki caps at Python <3.13, and its [en] extra
# drags torch for a transformer mode Kokoro never enables); listed here are
# misaki's runtime deps for the English path. spacy<4: unmarked, pip
# backtracks onto the unbuildable spacy 4.0.0.devN sdist. spacy also carried a
# `python_version < '3.14'` marker while it had no cp314 wheels; 3.8.13 ships
# them, and the marker had become a silent breakage (it dropped spacy on 3.14
# while the vendored G2P still imported it), so it is gone. The spacy English
# pipeline is not a package here: it is not on PyPI, and the snapshot fetches
# it from the Hub (qwen3-tts needs none of this).
# phonemizer-fork (not phonemizer): espeak data-path support, without which
# OOD words hard-exit the server. `espeakng-loader` bundles libespeak-ng +
# data (GPLv3 - fine in this optional extra, keep it out of core deps).
tts = [
    "mlx-audio",
    "spacy<4",
    "num2words",
    "addict",
    "phonemizer-fork",
    "espeakng-loader",
]
# `gmlx talk` voice chat: client-side mic capture + playback (sounddevice
# bundles PortAudio on macOS) and wake-word / VAD (sherpa-onnx: keyword
# spotting from a plain-text phrase + silero VAD in one wheel with bundled
# onnxruntime). Self-references [stt,tts] so a single install covers the whole
# single-machine loop - client audio plus the server-side whisper/kokoro the
# loop talks to (a remote-server client technically needs only the first two).
talk = ["sounddevice", "sherpa-onnx", "gmlx[stt,tts]"]
# The built-in tool-loop assistant (talk.brain: assistant, chat --assistant,
# server.assistants): the official Model Context Protocol SDK, used to connect
# the configured `assistant.mcp` tool servers (stdio + streamable HTTP). The
# tool loop and memory need nothing extra. mcp 2 renamed the streamable HTTP
# client and moved its types to snake_case fields (input_schema, is_error),
# and gmlx/assistant/mcp.py reads neither.
assistant = ["mcp<2"]
# The chat TUI, the full voice stack, and the MCP assistant in one install;
# `video` stays out, for OpenCV's size. Self-references only, so the leaf
# extras stay the source of truth.
all = ["gmlx[chat,talk,assistant]"]
# The `/v1/embeddings` encoders (EmbeddingGemma, Qwen3-Embedding, BERT,
# XLM-RoBERTa, ModernBERT) are gmlx's own code (gmlx/models/embedders) and need
# no package beyond the core ones. This empty extra is kept for back-compat so
# an existing `pip install 'gmlx[embeddings]'` still resolves.
embeddings = []

[project.urls]
Homepage = "https://github.com/asher/gmlx"
Documentation = "https://asher.github.io/gmlx/"
Repository = "https://github.com/asher/gmlx"
Changelog = "https://github.com/asher/gmlx/blob/main/CHANGELOG.md"
Issues = "https://github.com/asher/gmlx/issues"

[dependency-groups]
# The docs site: `pip install --group docs`, then `mkdocs serve` or
# `mkdocs build --strict`. Pinned so a new release cannot fail the CI build;
# MkDocs 2.0 drops the plugin and theme system Material needs.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.1",
]
# The test suite's plugins: `pip install --group test` (pip 25.1 or newer).
# CI and the GPU gate install the same pins.
test = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "pytest-cov==7.1.0",
    "pytest-repeat==0.9.4",
    "httpx==0.28.1",
    "build==1.6.1",
]

[project.scripts]
# `gmlx <verb>` (run / chat / serve / init / sync-models / ...) is the umbrella command.
gmlx = "gmlx.commands.cli:umbrella_main"

[tool.setuptools.packages.find]
include = ["gmlx*"]

[tool.setuptools.package-data]
"gmlx.models.deepseek_v41" = ["chat_template.jinja"]
"gmlx.image.families.flux3_klein" = ["pup_prompts_external_vlm.json"]
"gmlx.image.families.flux2_klein" = ["system_message_upsampling_t2i.txt"]
"gmlx.image.families.krea2" = ["expansion.txt"]
"gmlx.image.families.z_image" = ["pe_prompt_template.txt"]
"gmlx.image.families.moss_image" = ["caption_prompt.txt"]
"gmlx.container" = ["files/Containerfile", "guest/gmlx-entry"]
gmlx = ["_vendor/misaki/LICENSE", "_vendor/misaki/data/*",
            "_vendor/misaki/g2pkc/*.csv", "_vendor/misaki/g2pkc/*.txt",
            "_vendor/mlx_vlm/LICENSE", "_vendor/mlx_lm/LICENSE"]
# The ComfyUI node pack: its Apache-2.0 LICENSE, README and example
# workflows. tests/test_comfyui_pack.py holds every pack file to these globs.
"gmlx.comfyui_pack" = ["LICENSE", "README.md", "example_workflows/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end test needing a real GGUF (and, for parity, a llama.cpp binary); skipped unless KQUANT_TEST_GGUF_DIR is set",
    "needs_kvarn_ops: dispatches kvarn Metal kernels; skipped when the mlx-kquant ops probe fails (CPU device, op-less wheel)",
    "needs_kvarn_row_ends: dispatches the decode kernels with per-row ends; skipped unless the installed mlx-kquant is 0.4.9 or later",
    "nightly: costly and rarely broken; the daily CI legs and `gate.py run --full` run it, other runs pass -m 'not nightly'",
]
# pytest-timeout: a hung test fails with every thread's stack instead of
# holding the run. SIGALRM keeps an xdist worker alive, so its other results
# survive. Integration tests have no limit (tests/conftest.py).
timeout = 900
timeout_method = "signal"

[tool.pyright]
# Type-checks gmlx's calls into the copied mlx-vlm and mlx-lm
# (gmlx/_vendor). Scope is the files that import the copy statically,
# minus gmlx/models (mirrors, annotation exempt) and the backlog below;
# tests/test_pyright_scope.py keeps the list in step with the tree. Names
# reached through importlib.import_module are opaque to pyright; the
# claims check (gmlx/upstream/claims.py) covers the names gmlx rebinds.
# Runs in the macOS CI job, not the deps-free lint job: the copy imports
# mlx, transformers and the rest, which only that job installs.
include = [
    "gmlx/cache/apc_manager.py",
    "gmlx/cache/apc_pooling.py",
    "gmlx/cache/fresh_gate.py",
    "gmlx/cache/retire_key.py",
    "gmlx/cache/snapshot.py",
    "gmlx/commands/cli.py",
    "gmlx/distill/eval.py",
    "gmlx/distill/student.py",
    "gmlx/gen/benchmarks.py",
    "gmlx/gen/generation.py",
    "gmlx/gen/media_spans.py",
    "gmlx/gen/prefill_decay.py",
    "gmlx/gen/prefill_tail.py",
    "gmlx/gen/thinking_budget.py",
    "gmlx/image/families/qwen_image21/edit.py",
    "gmlx/load/hadamard_modules.py",
    "gmlx/load/loader.py",
    "gmlx/load/mlx_checkpoint.py",
    "gmlx/load/modules.py",
    "gmlx/load/mtp_target.py",
    "gmlx/load/rope_swap.py",
    "gmlx/load/vlm.py",
    "gmlx/lora_rows.py",
    "gmlx/serve/bridge_lm.py",
    "gmlx/serve/bridge_vlm.py",
    "gmlx/serve/cb_phase.py",
    "gmlx/serve/engine_jobs.py",
    "gmlx/serve/estimate.py",
    "gmlx/serve/gpu_share.py",
    "gmlx/serve/live_requests.py",
    "gmlx/serve/media_decode.py",
    "gmlx/serve/patches/context_copy.py",
    "gmlx/serve/patches/mtp_thinking.py",
    "gmlx/serve/patches/spec_processors.py",
    "gmlx/serve/residency.py",
    "gmlx/spec/admission.py",
    "gmlx/spec/ckpt.py",
    "gmlx/spec/dflash_drafter.py",
    "gmlx/spec/engine.py",
    "gmlx/spec/kv_quant.py",
    "gmlx/spec/mtp_load.py",
    "gmlx/spec/mtp_prefill.py",
    "gmlx/spec/row_procs.py",
    "gmlx/systemone/denoise.py",
    "gmlx/systemone/engine.py",
    "gmlx/tui/chat.py",
    "gmlx/tune/gdn.py",
    "gmlx/tune/kquant_lora.py",
    "gmlx/tune/lora.py",
    "gmlx/upstream/cascade_sdpa.py",
    "gmlx/upstream/gdn_patches.py",
    "scripts/structured_read_bench.py",
]
# The ComfyUI node pack runs in ComfyUI's Python, against torch and ComfyUI.
exclude = ["gmlx/comfyui_pack", "tests/comfyui_pack"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
pythonPlatform = "Darwin"
reportMissingTypeStubs = false
reportMissingModuleSource = false
# Deep-importing upstream privates is the design; the contract is the
# seam registry, not the upstream __all__.
reportPrivateImportUsage = false
# mlx ships py.typed with an unannotated nn.Module.__getattr__ whose else
# branch never returns, so every undeclared attribute of any Module infers
# as "Any | None". These rules then fire on ordinary submodule access and
# carry no drift signal (a moved symbol is an attribute-access, import or
# call error, never an Optional one).
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalCall = "none"
reportOptionalIterable = "none"
reportOptionalOperand = "none"

[tool.gmlx.pyright]
# Static importers of the copy not yet in the pyright gate. A file
# moves from here to [tool.pyright].include once it checks clean; the
# list only shrinks. tests/test_pyright_scope.py holds both lists to
# the tree.
backlog = [
    "gmlx/cache/kvarn_serve.py",
    "gmlx/commands/train.py",
    "gmlx/eval_guard.py",
    "gmlx/gen/diffusion.py",
    "gmlx/serve/admit_gate.py",
    "gmlx/serve/batch_sched.py",
    "gmlx/serve/decode_batch.py",
    "gmlx/serve/governor.py",
    "gmlx/serve/mem_preflight.py",
    "gmlx/serve/memtrace.py",
    "gmlx/serve/patches/row_failed.py",
    "gmlx/serve/patches/sampling.py",
    "gmlx/serve/queue_cap.py",
    "gmlx/serve/seed_rows.py",
    "gmlx/serve/step_timing.py",
    "gmlx/serve/tick_guard.py",
    "gmlx/upstream/dsv32_patches.py",
    "gmlx/upstream/occupancy_fuse.py",
    "scripts/check-coverage.py",
    "scripts/kld_harness.py",
]

[tool.ruff]
# Vendored third-party code keeps its upstream style. For the copied
# mlx-vlm and mlx-lm, `scripts/vendor_upstream.py lint` runs the E9, F821
# and F811 rules against a baseline, so a broken edit there still fails.
# The ComfyUI node pack and its suites run in ComfyUI's Python and keep
# the pack's own style.
extend-exclude = ["gmlx/_vendor", "tests/cache/upstream", "tests/systemone/_openjev_helper_ref.py",
                  "gmlx/comfyui_pack", "tests/comfyui_pack"]

[tool.ruff.lint]
# S110: a silent try-except-pass needs a reason on its except line
# (`# noqa: S110 - <where the error goes>`), or a log line instead.
extend-select = ["S110"]

[tool.ruff.lint.per-file-ignores]
# Lambda assignment is idiomatic for the tests' one-line monkeypatch stubs;
# a silent swallow in a test stub documents nothing.
"tests/**" = ["E731", "S110"]
# Verbatim upstream copies (source-equality-tested); a noqa comment would
# break the byte fidelity the equality tests certify.
"gmlx/models/qwen35/language.py" = ["E741"]
"gmlx/models/qwen35/verify_linear.py" = ["E741"]
"gmlx/models/gemma4/language.py" = ["E741"]
