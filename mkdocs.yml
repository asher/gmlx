site_name: gmlx
site_description: Run GGUF models on Apple Silicon.
site_url: https://asher.github.io/gmlx/
repo_url: https://github.com/asher/gmlx
repo_name: asher/gmlx

# Raw <img> tags in benchmarks.md use paths relative to docs/, which only
# resolve when each page is served from the same directory as its source.
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Follow the system theme
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  - scripts/mkdocs_hooks.py

exclude_docs: |
  assets/record-demo.sh

# The pages that have moved stay in docs/ as pointers for old links.
not_in_nav: |
  adapter-serving.md
  adding-architectures.md
  serving-architecture.md
  testing.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - README.md
  - Learn:
      - getting-started.md
      - glossary.md
      - migrating.md
  - Do:
      - launch.md
      - chat.md
      - menubar.md
      - talk.md
      - assistant.md
      - rag.md
      - decisions.md
      - vlm.md
      - lora.md
      - distill.md
      - streaming.md
      - performance.md
      - troubleshooting.md
  - Reference:
      - cli.md
      - server-config.md
      - api.md
      - services.md
      - env-vars.md
      - python.md
      - arch-coverage.md
      - benchmarks.md
  - Internals:
      - internals/README.md
      - internals/serving-architecture.md
      - internals/speculative-batching.md
      - internals/prompt-cache.md
      - internals/adding-architectures.md
      - internals/testing.md
      - internals/upstream-upgrades.md
      - internals/streaming-measurements.md
      - internals/structured-reads.md
      - internals/structured-read-measurements.md
      - internals/hadamard-fold.md
      - internals/debug-switches.md
      - internals/distill.md
