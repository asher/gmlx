name: release

# Tag-triggered build + publish. Push a vX.Y.Z tag (matching the version in
# pyproject.toml) to build the sdist + wheel and publish to PyPI via trusted
# publishing (no API token stored). One build job on arm64 Linux: the only
# compiled part is the static guest entry of `gmlx launch --container`, built
# on the same runner type as the tests' guest-entry job and shipped in both
# the sdist and the wheel.
#
# After the publish, the homebrew job regenerates the formula and pushes it to
# the asher/homebrew-gmlx tap. homebrew-verify then installs and tests it on
# macOS and reverts the push if that fails. To retry only these two jobs, run
# the workflow on the release tag with homebrew_only set.
#
# The docs job builds the site from docs/ at the tag and deploys it to GitHub
# Pages, so the site always describes the latest release. It is skipped on a
# homebrew_only retry.
#
# Prerequisites (one-time, before the first real release):
#   * a PyPI project + a Trusted Publisher entry for this repo/workflow;
#   * a GitHub Environment named "pypi" (optionally with required reviewers);
#   * a write-enabled deploy key on asher/homebrew-gmlx, with its private half
#     stored in this repo as the HOMEBREW_TAP_DEPLOY_KEY secret;
#   * Settings > Pages > Source set to "GitHub Actions", and a "v*" tag rule
#     under the github-pages environment's deployment branches and tags.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      homebrew_only:
        description: "Skip the PyPI build and publish; only update the tap"
        type: boolean
        default: false

jobs:
  build:
    name: build sdist + wheel
    if: ${{ !inputs.homebrew_only }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml ($pkg_version)"
            exit 1
          fi
      - name: Rust toolchain
        working-directory: crates/gmlx-entry
        run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-unknown-linux-musl
      - name: Build and test the guest entry
        run: |
          python scripts/build_guest_entry.py
          python -m pip install --upgrade pip build pytest
          GMLX_ENTRY_BIN="$PWD/gmlx/container/guest/gmlx-entry" \
            pytest -q --noconftest tests/container/test_container_entry.py
      - name: Build sdist + wheel
        run: |
          python -m build
          python scripts/check_guest_entry_dist.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: publish the docs site
    needs: [publish]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the site
        # scripts/mkdocs_hooks.py points links to files outside docs/ at this
        # tag on GitHub.
        run: |
          python -m pip install --upgrade pip
          pip install --group docs
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  homebrew:
    name: update the Homebrew tap
    needs: [publish]
    # Also runs when build and publish were skipped for a homebrew_only retry.
    if: ${{ !cancelled() && (needs.publish.result == 'success' || inputs.homebrew_only) }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/checkout@v6
        with:
          repository: asher/homebrew-gmlx
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Generate the formula
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python -m pip install uv
          python scripts/brew_formula.py "$version" -o tap/Formula/gmlx.rb
          ruby -c tap/Formula/gmlx.rb
      - name: Commit and push
        id: commit
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gmlx.rb
          if git diff --cached --quiet; then
            echo "formula already at $VERSION"
            exit 0
          fi
          git commit -m "gmlx $VERSION"
          git push origin HEAD
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  homebrew-verify:
    name: verify the Homebrew formula
    needs: [homebrew]
    if: ${{ needs.homebrew.outputs.commit != '' }}
    # The formula requires macOS 26: mlx-kquant publishes macosx_26_0 wheels only.
    runs-on: macos-26
    env:
      COMMIT: ${{ needs.homebrew.outputs.commit }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          repository: asher/homebrew-gmlx
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          ref: ${{ needs.homebrew.outputs.commit }}
          fetch-depth: 2
          path: tap
      - name: Audit, install and test the formula
        run: |
          brew tap asher/gmlx "$GITHUB_WORKSPACE/tap"
          brew trust asher/gmlx
          brew style asher/gmlx
          brew audit --strict --formula asher/gmlx/gmlx
          brew install asher/gmlx/gmlx
          brew test asher/gmlx/gmlx
      - name: Revert the formula
        if: failure()
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$COMMIT" ]; then
            echo "::error::the tap moved past $COMMIT, so it was not reverted"
            exit 1
          fi
          git revert --no-edit "$COMMIT"
          git push origin HEAD:main
          echo "::error::the formula failed its install check and was reverted"
