[package]
name = "gmlx-entry"
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"
description = "Static guest entry for gmlx launch container mode"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
# fork, setsid, signal dispositions and access(2), which std does not expose.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
